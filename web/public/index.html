<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>miniRDB 회원관리</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>회원 관리 (miniRDB)</h1>
</header>

<main>
  <section class="card">
    <h2>회원가입</h2>
    <form id="member-form">
      <label>아이디 * <input name="username" required maxlength="200" /></label>
      <label>비밀번호 * <input name="password" type="password" required maxlength="200" /></label>
      <label>이름 * <input name="name" required maxlength="200" /></label>
      <label>이메일 <input name="email" type="email" maxlength="200" /></label>
      <label>전화번호 <input name="phone" maxlength="200" /></label>
      <label>주소 <input name="address" maxlength="200" /></label>
      <label>생년월일 <input name="birth_date" type="date" /></label>
      <button type="submit">등록</button>
    </form>
    <p id="form-message" class="message"></p>
  </section>

  <section class="card">
    <h2>회원 목록</h2>
    <table id="member-table">
      <thead>
        <tr>
          <th>ID</th><th>아이디</th><th>이름</th><th>이메일</th><th>전화번호</th><th>주소</th><th>생년월일</th><th>가입일시</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
